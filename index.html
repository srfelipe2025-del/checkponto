<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>CheckPonto - Leitor</title>
    <!-- Biblioteca Html5Qrcode para leitura de QR Code via Câmera -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #18191a; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            color: #fff;
        }
        
        /* Botões no canto superior esquerdo */
        .top-controls {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
        }
        .btn-topo {
            background: #3a3b3c;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-topo:hover {
            background: #4e4f50;
        }

        .container { 
            background: #242526; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.5); 
            width: 480px; 
            text-align: center; 
            position: relative;
        }
        h2 { color: #fff; margin-bottom: 8px; font-size: 24px; }
        .subtitle { color: #b0b3b8; margin-bottom: 25px; font-size: 14px; }
        
        /* Estilo do Leitor de QR Code / Câmera */
        #reader { 
            width: 100%; 
            border-radius: 12px; 
            overflow: hidden; 
            margin-bottom: 15px; 
            background: #000; 
            border: 3px solid #2d88ff;
        }
        
        /* Corrige o sentido do movimento da câmera (espelhamento natural) */
        #reader video {
            transform: scaleX(-1);
        }

        #mensagemFeedback { margin-top: 15px; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: bold; display: none; }
        .sucesso { background: #137333; color: #e6f4ea; border: 1px solid #1e8e3e; }
        .erro { background: #c5221f; color: #fce8e6; border: 1px solid #ea4335; }
    </style>
</head>
<body>
    <!-- Controles no Canto Superior Esquerdo -->
    <div class="top-controls">
        <button class="btn-topo" id="btnAdmin">Admin</button>
        <button class="btn-topo" id="btnTelaCheia">Tela Cheia</button>
    </div>

    <div class="container">
        <h2>CheckPonto - Leitor</h2>
        <div class="subtitle">Aponte o crachá com o QR Code para a câmera</div>

        <!-- Leitor de Câmera (QR Code) -->
        <div id="reader"></div>

        <div id="mensagemFeedback"></div>
    </div>

    <script type="module">
        import { supabase } from './services/supabase.js';

        const divFeedback = document.getElementById('mensagemFeedback');
        let processando = false;

        // Ação do Botão Admin com senha
        document.getElementById('btnAdmin').addEventListener('click', () => {
            const senhaDigitada = prompt("Digite a senha de Administrador:");
            if (senhaDigitada === "emez2026") {
                window.location.href = "acompanhamento.html";
            } else if (senhaDigitada !== null) {
                alert("❌ Senha incorreta!");
            }
        });

        // Ação do Botão Tela Cheia
        document.getElementById('btnTelaCheia').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log("Erro ao ativar tela cheia: ", err);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        });

        async function processarRegistro(matriculaLida) {
            if (processando) return;
            processando = true;

            const matricula = matriculaLida.trim();
            if (!matricula) {
                processando = false;
                return;
            }

            divFeedback.style.display = 'none';

            // 1. Verificar se o funcionário existe cadastrado
            const { data: func, error: errFunc } = await supabase
                .from('funcionarios')
                .select('*')
                .eq('matricula', matricula)
                .single();

            if (errFunc || !func) {
                mostrarFeedback("❌ Matrícula não encontrada no sistema.", "erro");
                setTimeout(() => { processando = false; }, 4000);
                return;
            }

            // 2. Buscar o último registro deste funcionário para alternar o status
            const { data: ultimoRegistroArr } = await supabase
                .from('registros_ponto')
                .select('*')
                .eq('matricula', matricula)
                .order('data_hora', { ascending: false })
                .limit(1);

            let tipoRegistro = 'Entrada';
            let mensagemSucesso = '';

            if (ultimoRegistroArr && ultimoRegistroArr.length > 0) {
                const ultimo = ultimoRegistroArr[0];
                if (ultimo.tipo === 'Entrada' || ultimo.tipo === 'Trabalhando') {
                    tipoRegistro = 'Encerrado';
                    mensagemSucesso = `✅ Saída registrada: <strong>${func.nome}</strong>! Bom descanso.`;
                } else {
                    tipoRegistro = 'Entrada';
                    mensagemSucesso = `✅ Entrada registrada: <strong>${func.nome}</strong>! Bom trabalho.`;
                }
            } else {
                tipoRegistro = 'Entrada';
                mensagemSucesso = `✅ Entrada registrada: <strong>${func.nome}</strong>! Bom trabalho.`;
            }

            // 3. Salva o registro no Supabase
            const { error: errInsert } = await supabase.from('registros_ponto').insert([{
                matricula: matricula,
                tipo: tipoRegistro,
                data_hora: new Date().toISOString()
            }]);

            if (errInsert) {
                mostrarFeedback("❌ Erro ao registrar ponto.", "erro");
            } else {
                mostrarFeedback(mensagemSucesso, "sucesso");
            }

            // Intervalo de 4 segundos para liberar o próximo registro
            setTimeout(() => {
                processando = false;
            }, 4000);
        }

        // Inicializar a Câmera para leitura automática de QR Code
        function onScanSuccess(decodedText, decodedResult) {
            processarRegistro(decodedText);
        }

        try {
            const html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "user" }, 
                { fps: 10, qrbox: { width: 250, height: 250 } },
                onScanSuccess
            ).catch(err => {
                console.log("Câmera não iniciada automaticamente ou indisponível: ", err);
            });
        } catch (e) {
            console.log("Erro ao carregar o leitor de QR Code: ", e);
        }

        function mostrarFeedback(texto, classe) {
            divFeedback.innerHTML = texto;
            divFeedback.className = classe;
            divFeedback.style.display = 'block';
            
            setTimeout(() => {
                divFeedback.style.display = 'none';
            }, 4000);
        }
    </script>
</body>
</html>
