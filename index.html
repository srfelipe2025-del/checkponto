<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>CheckPonto - Leitor de Crachá</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: white; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .container { text-align: center; width: 100%; max-width: 600px; padding: 20px; }
        h1 { margin-bottom: 5px; font-size: 28px; }
        p { color: #aaa; margin-bottom: 20px; }
        
        #reader { width: 100%; border-radius: 12px; overflow: hidden; border: 4px solid #007bff; background: #000; }
        
        /* Área secreta de admin / tela cheia discreta no canto */
        .menu-secreto { position: absolute; top: 15px; left: 15px; display: flex; gap: 10px; opacity: 0.1; transition: opacity 0.3s; }
        .menu-secreto:hover { opacity: 1; } /* Só aparece bem se passar o mouse por cima do canto */
        .btn-link { padding: 6px 12px; background: #333; color: #aaa; text-decoration: none; border-radius: 4px; font-size: 12px; border: 1px solid #444; cursor: pointer; }
        .btn-link:hover { background: #444; color: white; }

        /* Estilo do Card de Sucesso Kiosk (Tela Cheia) */
        #modalSucesso {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 123, 255, 0.95);
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        #modalSucesso h2 { font-size: 45px; margin: 0 0 10px 0; }
        #modalSucesso p { font-size: 24px; color: #fff; margin: 5px 0; }
        #modalSucesso .hora { font-size: 60px; font-weight: bold; margin-top: 20px; background: rgba(0,0,0,0.2); padding: 10px 30px; border-radius: 10px; }
    </style>
</head>
<body>
    <!-- Cantinho secreto/discreto para admin e tela cheia -->
    <div class="menu-secreto">
        <button class="btn-link" onclick="tentarAcessarGestao()">Admin</button>
        <button class="btn-link" onclick="toggleFullscreen()">Tela Cheia</button>
    </div>

    <div class="container">
        <h1>CheckPonto - Leitor</h1>
        <p>Aponte o crachá com o QR Code para a câmera</p>
        <div id="reader"></div>
    </div>

    <!-- Tela de Alerta Visual Kiosk -->
    <div id="modalSucesso">
        <h2 id="msgNome">Bem-vindo!</h2>
        <p id="msgTipo">Ponto Registrado com Sucesso</p>
        <div class="hora" id="msgHora">00:00:00</div>
    </div>

    <!-- Biblioteca do Html5Qrcode -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script type="module">
        import { supabase } from './services/supabase.js';

        let lendoAtivo = true;

        function tocarBeep() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = 800;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch (e) {
                console.log('Áudio não suportado');
            }
        }

        async function onScanSuccess(decodedText) {
            if (!lendoAtivo) return;
            lendoAtivo = false;

            const matricula = decodedText.trim();
            const agora = new Date();
            const horaFormatada = agora.toLocaleTimeString('pt-BR');

            const { data: func, error: errFunc } = await supabase
                .from('funcionarios')
                .select('*')
                .eq('matricula', matricula)
                .single();

            if (errFunc || !func) {
                tocarBeep();
                alert(`Crachá não encontrado (Matrícula: ${matricula})`);
                setTimeout(() => { lendoAtivo = true; }, 2000);
                return;
            }

            const hojeInicio = new Date();
            hojeInicio.setHours(0, 0, 0, 0);

            const { data: regs, error: errReg } = await supabase
                .from('registros_ponto')
                .select('*')
                .eq('matricula', matricula)
                .gte('data_hora', hojeInicio.toISOString())
                .order('data_hora', { ascending: true });

            if (errReg) {
                alert('Erro ao consultar registros.');
                lendoAtivo = true;
                return;
            }

            let tipoRegistro = 'Trabalhando';
            let textoAcao = 'Entrada Registrada';

            if (regs && regs.length > 0) {
                const ultimo = regs[regs.length - 1];
                if (ultimo.tipo === 'Trabalhando') {
                    tipoRegistro = 'Encerrado';
                    textoAcao = 'Saída Registrada';
                }
            }

            const { error: errInsert } = await supabase.from('registros_ponto').insert([{
                matricula: matricula,
                tipo: tipoRegistro,
                data_hora: agora.toISOString()
            }]);

            if (errInsert) {
                alert('Erro ao salvar ponto.');
                lendoAtivo = true;
                return;
            }

            tocarBeep();

            const modal = document.getElementById('modalSucesso');
            document.getElementById('msgNome').innerText = func.nome;
            document.getElementById('msgTipo').innerText = textoAcao;
            document.getElementById('msgHora').innerText = horaFormatada;
            modal.style.display = 'flex';

            setTimeout(() => {
                modal.style.display = 'none';
                lendoAtivo = true;
            }, 2200);
        }

        const html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
            { facingMode: "user" },
            { fps: 10, qrbox: { width: 250, height: 250 } },
            onScanSuccess
        ).catch(err => {
            console.error("Erro ao iniciar a câmera:", err);
        });

        // Função de Proteção por Senha para o Painel de Gestão
        window.tentarAcessarGestao = function() {
            const senha = prompt("Digite a senha de administrador:");
            // Definição simples da senha de admin (pode alterar aqui se quiser, ex: '1234' ou 'admin')
            if (senha === "1234" || senha === "admin") {
                window.location.href = "acompanhamento.html";
            } else if (senha !== null) {
                alert("Senha incorreta!");
            }
        };

        window.toggleFullscreen = function() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Erro ao tentar modo tela cheia: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        };
    </script>
</body>
</html>
