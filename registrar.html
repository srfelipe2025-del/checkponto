<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Ponto - EMEZ</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .card { background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; margin-bottom: 20px; }
        h2 { color: #333; margin-bottom: 5px; }
        p { color: #666; font-size: 13px; margin-bottom: 15px; }
        #reader { width: 100%; border-radius: 6px; overflow: hidden; }
        #mensagem { margin-top: 15px; font-weight: bold; font-size: 14px; }
        #avisoLink { background: #fff3cd; color: #856404; padding: 10px; border-radius: 4px; font-size: 12px; margin-bottom: 15px; display: none; border: 1px solid #ffeeba; }
        .admin-box { background: #e9ecef; border: 1px solid #ced4da; display: none; text-align: left; }
        .admin-box h3 { text-align: center; margin-top: 0; color: #007bff; }
        .btn-admin { background: #007bff; color: #fff; border: none; padding: 10px; width: 100%; border-radius: 4px; font-size: 13px; cursor: pointer; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="card" id="cardLeitor">
        <h2>Registro por QR Code</h2>
        <p>Aponte a câmera para registrar sua entrada ou saída.</p>
        <div id="avisoLink"></div>
        <div id="reader"></div>
        <div id="mensagem"></div>
    </div>

    <div class="card admin-box" id="painelAdmin">
        <h3>Painel do Administrador</h3>
        <button class="btn-admin" onclick="gerarLink('permanente')">Copiar Link Permanente</button>
        <button class="btn-admin" style="background: #ffc107; color: #000;" onclick="gerarLink('diario')">Copiar Link Válido Só Para Hoje</button>
        <div id="boxLinkGerado" style="display:none;"><div id="textoLinkGerado" style="word-break: break-all; background: #fff; padding: 8px; border: 1px solid #ccc; margin-top: 8px; font-size: 11px;"></div></div>
    </div>

    <script type="module">
        import { supabase } from './services/supabase.js';

        let scannerAtivo = null;

        // Função para calcular distância entre coordenadas (Haversine)
        function calcularDistancia(lat1, lon1, lat2, lon2) {
            const R = 6371000; // Raio da Terra em metros
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const dataValidade = urlParams.get('data'); 
            const isAdmin = urlParams.get('admin');

            if (isAdmin === 'true') document.getElementById('painelAdmin').style.display = 'block';

            if (dataValidade) {
                const hojeStr = new Date().toISOString().split('T')[0];
                const avisoDiv = document.getElementById('avisoLink');
                avisoDiv.style.display = 'block';
                if (dataValidade !== hojeStr) {
                    avisoDiv.style.background = '#f8d7da'; avisoDiv.style.color = '#721c24';
                    avisoDiv.innerHTML = `❌ Link expirado! Válido apenas para ${dataValidade.split('-').reverse().join('/')}.`;
                    return; 
                }
            }
            iniciarScannerQR();
        });

        function iniciarScannerQR() {
            scannerAtivo = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 250, height: 250 } }, false);
            scannerAtivo.render(onScanSuccess, () => {});
        }

        async function onScanSuccess(decodedText) {
            const matriculaLida = decodedText.trim();
            const msgDiv = document.getElementById('mensagem');
            msgDiv.style.color = '#007bff';
            msgDiv.innerText = `Lido (Matrícula: ${matriculaLida}). Validando localização...`;

            if (scannerAtivo) try { await scannerAtivo.pause(); } catch (e) {}

            navigator.geolocation.getCurrentPosition(async (position) => {
                const uLat = position.coords.latitude;
                const uLng = position.coords.longitude;

                // Validação de Local
                const { data: locais } = await supabase.from('locais_permitidos').select('*');
                let dentroDoRaio = false;
                for (const local of locais) {
                    if (calcularDistancia(uLat, uLng, local.latitude, local.longitude) <= local.raio_metros) {
                        dentroDoRaio = true; break;
                    }
                }

                if (!dentroDoRaio) {
                    msgDiv.style.color = 'red';
                    msgDiv.innerText = '❌ Registro negado: Você está fora da área permitida da escola.';
                    retomarScanner(); return;
                }

                // Prosseguir com o registro
                const { data: func } = await supabase.from('funcionarios').select('*').eq('matricula', matriculaLida).single();
                if (!func) { msgDiv.style.color = 'red'; msgDiv.innerText = 'Matrícula não encontrada.'; retomarScanner(); return; }

                const hojeStr = new Date().toISOString().split('T')[0];
                const { data: regs } = await supabase.from('registros_ponto').select('*').eq('matricula', matriculaLida).gte('data_hora', hojeStr + 'T00:00:00');
                
                let tipoRegistro = (regs && regs.length % 2 !== 0) ? 'Saída' : 'Entrada';
                const agora = new Date().toISOString().replace('Z', '-03:00');

                await supabase.from('registros_ponto').insert([{
                    matricula: matriculaLida, tipo: tipoRegistro, data_hora: agora, latitude: uLat, longitude: uLng
                }]);

                msgDiv.style.color = 'green';
                msgDiv.innerText = `✅ Sucesso! ${tipoRegistro} registrada.`;
                setTimeout(() => { msgDiv.innerText = ''; retomarScanner(); }, 4000);

            }, () => {
                msgDiv.style.color = 'red';
                msgDiv.innerText = '⚠️ Ative o GPS para registrar o ponto.';
                retomarScanner();
            }, { enableHighAccuracy: true, timeout: 10000 });
        }

        async function retomarScanner() { if (scannerAtivo) try { await scannerAtivo.resume(); } catch (e) {} }

        window.gerarLink = function(tipo) {
            let urlBase = window.location.origin + window.location.pathname;
            document.getElementById('boxLinkGerado').style.display = 'block';
            const link = tipo === 'diario' ? `${urlBase}?data=${new Date().toISOString().split('T')[0]}` : urlBase;
            document.getElementById('textoLinkGerado').innerText = link;
            navigator.clipboard.writeText(link);
            alert('Link copiado!');
        };
    </script>
</body>
</html>
